name: Terraform Deploy

on:
  push:
    branches:
      - main
      - develop
      - terraform-ec2

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

    #  - name: Verify AWS Credentials
    #    run: aws sts get-caller-identity
    #    env:
    #      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    #      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    #      AWS_DEFAULT_REGION: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Determine Environment Variables File
        id: env-vars
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "tfvars_file=prod.tfvars" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "terraform-ec2" ]]; then
            echo "tfvars_file=dev.tfvars" >> $GITHUB_ENV
          else
            echo "Branch not supported"
            exit 1
          fi

      - name: Terraform Plan
        run: terraform plan -var-file=environments/${{ env.tfvars_file }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      # Optional: Add Terraform Apply Step
      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=environments/${{ env.tfvars_file }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
